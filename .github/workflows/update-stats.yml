name: Update Profile Stats Natively

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every single day at midnight
  workflow_dispatch: # Allows you to run it manually with one click whenever you want

permissions:
  contents: write # Grants the workflow permission to write updates back to your README

jobs:
  refresh-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Profile Repo
        uses: actions/checkout@v4

      - name: Fetch Live Stats via Authenticated GitHub API
        run: |
          # Fetch fresh data using the repository's built-in authentication token
          USER_JSON=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://github.com)
          
          # Extract live counts safely
          REPOS=$(echo "$USER_JSON" | jq '.public_repos')
          FOLLOWERS=$(echo "$USER_JSON" | jq '.followers')
          FOLLOWING=$(echo "$USER_JSON" | jq '.following')
          
          # Verify that we received valid numbers before editing the file
          if [ "$REPOS" = "null" ] || [ -z "$REPOS" ]; then
            echo "Error: Failed to fetch valid data from GitHub API. Response was: $USER_JSON"
            exit 1
          fi
          
          # Inject the new values directly into the Markdown text line
          sed -i "s|<!-- REPOS_COUNT -->.*|<!-- REPOS_COUNT -->**$REPOS** Active Projects |g" README.md
          sed -i "s|<!-- NETWORK_COUNT -->.*|<!-- NETWORK_COUNT -->**$FOLLOWERS** Followers / **$FOLLOWING** Following |g" README.md

      - name: Commit and Push Updated Stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add README.md
          git commit -m "chore: automated profile metrics update" || exit 0
          git push
