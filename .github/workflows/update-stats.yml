name: Update Profile Stats Natively

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every single day at midnight
  workflow_dispatch: # Allows you to run it manually with one click whenever you want

permissions:
  contents: write # Grants the workflow permission to write updates back to your README

jobs:
  refresh-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Profile Repo
        uses: actions/checkout@v4

      - name: Fetch Live Stats via Native GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch fields natively using GitHub's built-in CLI tool
          REPOS=$(gh api users/ksaad20 --jq '.public_repos')
          FOLLOWERS=$(gh api users/ksaad20 --jq '.followers')
          FOLLOWING=$(gh api users/ksaad20 --jq '.following')
          
          # Verify that we received valid numbers before modifying the markdown file
          if [ -z "$REPOS" ] || [ "$REPOS" = "null" ]; then
            echo "Error: Native GitHub CLI could not retrieve data."
            exit 1
          fi
          
          echo "Successfully retrieved metrics: Repos=$REPOS, Followers=$FOLLOWERS, Following=$FOLLOWING"
          
          # Inject the new values directly into the Markdown text line
          sed -i "s|<!-- REPOS_COUNT -->.*|<!-- REPOS_COUNT -->**$REPOS** Active Projects |g" README.md
          sed -i "s|<!-- NETWORK_COUNT -->.*|<!-- NETWORK_COUNT -->**$FOLLOWERS** Followers / **$FOLLOWING** Following |g" README.md

      - name: Commit and Push Updated Stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add README.md
          git commit -m "chore: automated profile metrics update" || exit 0
          git push
